<div class="form-group litm--reference-appearance-row">
	<label for="reference-appearance-{{name}}">{{label}}</label>
	<div class="form-fields litm--reference-color-field">
		<input id="reference-appearance-{{name}}" type="text" name="{{name}}" value="{{value}}" pattern="^#[0-9A-Fa-f]{6}$" data-color-text="{{name}}">
		<input type="color" value="{{pickerValue}}" data-color-picker="{{name}}" aria-label="{{label}}">
	</div>
</div>
