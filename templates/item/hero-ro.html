<div class="litm--hero-wrapper litm--hero-wrapper item" data-item-id="{{hero.id}}" data-id="{{hero.id}}">
	<img width="250px" class="litm--hero-bg-frame" src="systems/litm/assets/media/background-frame.webp"
		aria-hidden="true">
	<div class="litm--hero-bg litm--hero-bg" data-context="menu">
		<div class="meta">
			<button class="litm--specials litm--specials-button" type="button" data-click="toggle-backside"
				data-type="hero" data-id="{{hero.id}}" data-tooltip="{{localize 'Specials'}}">
			<img src="systems/litm/assets/media/icons/{{ifThen hero.backside 'special_icn.svg' 'special-front_icn.svg'}}"
				alt="Specials" class="litm--specials-backside"/>
			</button>
			{{hero.name}}
		</div>
		<ul class="taglist">
			{{#each hero.contents as |tag|}}
				{{> systems/litm/templates/partials/relationship.html tag=tag key=@key path=(concat "items." ../hero.id ".system.contents") embedded=true remove=false}}
			{{/each}}
		</ul>
	</div>
</div>
